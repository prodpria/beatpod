# Publishes the beatpod store and builds beats/list.json from the beats folder.
# Runs automatically every time you upload or change anything.
name: Publish store

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Make the beat list
        run: |
          python3 -c "import os,json; f=sorted(n for n in os.listdir('beats') if n.lower().endswith(('.mp3','.wav','.m4a','.ogg'))); open('beats/list.json','w').write(json.dumps(f, indent=1)); print(f)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
